name: D1 Backup

# Weekly D1 export to SQL, committed to the repo.
# If Cloudflare ever loses the database, we can rebuild from these dumps.
# Runs Sunday 02:00 UTC. Manual trigger available.

on:
  schedule:
    - cron: "0 2 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: d1-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Export D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler --no-audit --no-fund 2>/dev/null
          mkdir -p backups
          DATE=$(date -u +%Y-%m-%d)
          wrangler d1 export whalesignal-db --remote --output backups/d1-$DATE.sql 2>&1 | tail -2
          # keep only last 4 backups
          ls -t backups/d1-*.sql | tail -n +5 | xargs -r rm
          echo "backup_size=$(du -h backups/d1-$DATE.sql | cut -f1)" >> $GITHUB_OUTPUT

      - name: Commit backup
        run: |
          git config user.name "whalesignal-bot"
          git config user.email "bot@whalesignal"
          git add backups/
          git commit -m "d1 backup: $(date -u +%Y-%m-%d) [skip ci]" || echo "nothing to commit"
          git push || echo "::warning::push failed"
