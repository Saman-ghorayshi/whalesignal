# CI: run the test suite on every push + PR. Zero dependencies — plain
# node:test — so this is fast and can't rot from npm drift.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/run_tests.js
      # static SQL validation (every query vs the real schema) + cross-file
      # wiring (imports resolve, env bindings known) — catch the incomplete
      # feature class before deploy
      - run: node tools/check_sql.mjs
      - run: node tools/check_wiring.mjs

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx hyperliquid-python-sdk eth-account pytest
      - run: pytest tests/test_main.py tests/test_close_trades.py tests/test_llm.py -v
