name: Trade Loop

# Triggered by Cloudflare Worker (bot.js) via repository_dispatch
# when a new whale alert is detected. Also manually triggerable.
on:
  repository_dispatch:
    types: [new_alert]
  workflow_dispatch: {}

permissions:
  contents: write

# T6: one run at a time. Every alert fires a dispatch; without this, bursts
# of alerts spawn overlapping runs that race on the trades.db push.
concurrency:
  group: trade-loop
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    # T5: 5 min was incompatible with sequential 20-40s LLM calls x up to 20
    # signals (+ pip install). 20 min gives headroom; the real fix is
    # batching/parallelizing the per-signal LLM calls.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # full history: the rebase-before-push below needs it
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-trade-${{ hashFiles('.github/workflows/trade.yml') }}

      - run: pip install httpx hyperliquid-python-sdk eth-account

      - name: Run trade loop
        env:
          R2_ALERTS_URL: ${{ secrets.R2_ALERTS_URL }}
          HL_TESTNET_KEY: ${{ secrets.HL_TESTNET_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          STARTING_BALANCE: "100"
        run: |
          ALERTS_URL="${R2_ALERTS_URL:-https://whalesignal-bot.mv3sxp7x4fkv-6d9.workers.dev/history?limit=20}"
          python -m trading_loop.main \
            --db ./trades.db \
            --alerts-url "$ALERTS_URL" \
            --testnet-key "$HL_TESTNET_KEY" \
            --starting-balance "$STARTING_BALANCE" \
            --gemini-key "$GEMINI_KEY" \
            --once

      - name: Commit trades.db back to repo
        run: |
          git config user.name "whalesignal-bot"
          git config user.email "bot@whalesignal"
          # Rebase onto whatever landed while we were trading (T6).
          git pull --rebase --autostash || echo "::warning::rebase failed — pushing anyway"
          # T2: trades.db is gitignored by pattern (*.db); -f overrides.
          # NOTE: committing sqlite to git is a stopgap. The durable fix is
          # moving loop state to D1/R2 (already paid for) instead of git.
          git add -f trades.db
          git commit -m "trades.db: updated by GH Actions trade loop [skip ci]" || true
          git push || echo "::warning::push failed — next run's rebase will pick it up"
