name: Trade Loop

# Triggered by Cloudflare Worker (bot.js) via repository_dispatch
# when a new whale alert is detected. Also manually triggerable.
on:
  repository_dispatch:
    types: [new_alert]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install httpx hyperliquid-python-sdk eth-account

      - name: Run trade loop
        env:
          R2_ALERTS_URL: ${{ secrets.R2_ALERTS_URL }}
          HL_TESTNET_KEY: ${{ secrets.HL_TESTNET_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          STARTING_BALANCE: "100"
        run: |
          python -m trading_loop.main \
            --db ./trades.db \
            --alerts-url "$R2_ALERTS_URL" \
            --testnet-key "$HL_TESTNET_KEY" \
            --starting-balance "$STARTING_BALANCE" \
            --gemini-key "$GEMINI_KEY"

      # trades.db is a local artifact — committing a binary DB to the repo
      # on every run bloats history and conflicts with .gitignore. The paper
      # results live in the DB on the runner; export to the dashboard later
      # if/when the paper results become a product surface.
      - name: Note paper-trade results
        run: echo "trades stay on the runner; commit-to-repo disabled"
