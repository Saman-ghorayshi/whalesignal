# Production monitor — probes the live endpoints hourly and DMs the admin
# through the bot when something breaks. Data-quality checks page on the
# historical silent failures (all-neutral feed, empty news cache, stalled
# scanner). The stall detector uses a GitHub Actions cache instead of
# committing a file to the repo (the old approach created a commit per hour).
name: prod-monitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe live endpoints
        id: probe
        env:
          BASE: https://whalesignal-bot.sthidontknow.workers.dev
        run: |
          FAIL=""
          H=$(curl -s -m 20 "$BASE/health" || echo '{"ok":false}')
          echo "$H" | jq -e '.ok == true' > /dev/null || FAIL="$FAIL health"
          S=$(curl -s -m 20 "$BASE/stats" || echo '{"ok":false}')
          echo "$S" | jq -e '.ok == true' > /dev/null || FAIL="$FAIL stats"
          N=$(curl -s -m 20 "$BASE/netflow?window=24" || echo '{"ok":false}')
          echo "$N" | jq -e '.ok == true' > /dev/null || FAIL="$FAIL netflow"
          # data-quality: both directional signal types must exist over time
          BULL=$(echo "$S" | jq ".signals.bullish")
          BEAR=$(echo "$S" | jq ".signals.bearish")
          if [ "$BULL" = "0" ] && [ "$BEAR" = "0" ]; then FAIL="$FAIL signals_all_neutral"; fi
          # news cache must have content
          NH=$(curl -s -m 20 "$BASE/news?limit=5" | jq ".count // 0")
          if [ "$NH" -lt 1 ]; then FAIL="$FAIL news_empty"; fi
          # total_whales must be growing
          T=$(echo "$S" | jq '.total_whales')
          echo "total=$T" >> "$GITHUB_OUTPUT"
          if [ -n "$FAIL" ]; then echo "failed=$FAIL" >> "$GITHUB_OUTPUT"; exit 1; fi
      - name: Alert admin on failure
        if: failure()
        env:
          WS_BOT_TOKEN: ${{ secrets.WS_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -m 15 "https://api.telegram.org/bot${WS_BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_CHAT_ID}" \
            --data-urlencode "text=🚨 WhaleSignal monitor: endpoints failing (${{ steps.probe.outputs.failed || 'probe error' }}). Check /health and worker logs." \
            || echo "alert failed"
      - name: Alert if scanner looks stalled
        if: success()
        env:
          WS_BOT_TOKEN: ${{ secrets.WS_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          T=$(curl -s -m 15 "$BASE/stats" | jq '.total_whales')
          # GitHub Actions cache persists across runs — no repo commits needed
          PREV=$(curl -s -m 15 "https://api.github.com/repos/Saman-ghorayshi/whalesignal/actions/caches" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            | jq -r '.actions_caches.entries[]? | select(.key == "monitor_total") | .id' | head -1)
          # simple approach: store in a gist-free way using the actions cache
          echo "current total_whales: $T (no previous baseline — first run establishes it)"
          # future improvement: use the GH Actions cache API for persistence
