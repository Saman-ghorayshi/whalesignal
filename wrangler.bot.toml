# wrangler.bot.toml
# Worker #3: Telegram webhook + alert delivery queue consumer.
# Deploy with:  npx wrangler deploy -c wrangler.bot.toml
#
# Bindings:
#   DB      D1
#   KV      KV (for /latest market footer)
#   BOTQ    Queue CONSUMER (whalesignal-bot-q, populated by analyst)
#
# Secrets (set once via wrangler secret put):
#   BOT_TOKEN        Telegram bot token from @BotFather
#   PUBLIC_CHANNEL   e.g. @whalesignalnews  (can be set as a var, since not secret)

name = "whalesignal-bot"
main = "src/bot.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Consumes "post this alert" messages from the analyst worker
[[queues.consumers]]
queue = "whalesignal-bot-q"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

[[d1_databases]]
binding = "DB"
database_name = "whalesignal-db"
# placeholder — replaced by deploy_all.py
database_id = "6e369b7a-a8df-4864-b8f5-7bdc171ecf3d"

[[kv_namespaces]]
binding = "KV"
# placeholder — replaced by deploy_all.py
id = "1b3b2a8763b0497880983d3e9d26f76a"

# R2 bucket: optional NDJSON export (uncomment if R2 is enabled on your Cloudflare account)
# [[r2_buckets]]
# binding = "ALERTS_R2"
# bucket_name = "whalesignal-alerts"

# Service Binding to analyst worker (zero-overhead internal RPC)
[[services]]
binding = "ANALYST_SERVICE"
service = "whalesignal-analyst"

# Non-secret vars are fine to set as plain vars.
[vars]
PUBLIC_CHANNEL = "@Whaletracker_sig"

# Routes: this worker is the one that gets a public URL.
# Deploy script will print the workers.dev URL after deploy; you use that
# to set the Telegram webhook:
#   curl "https://api.telegram.org/bot<TOKEN>/setWebhook?url=https://whalesignal-bot.<acct>.workers.dev/tg/<TOKEN>"
