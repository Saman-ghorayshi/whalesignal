<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WhaleSignal — Research & Calibration</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🐋</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,510;14..32,590&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#08090a;--card:rgba(255,255,255,0.025);--t1:#f7f8f8;--t2:#d0d6e0;--t3:#8a8f98;--t4:#62666d;--a:#7170ff;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--border-sub:rgba(255,255,255,0.04);--r:8px}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--t2);line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
.con{max-width:860px;margin:0 auto;padding:0 24px}
header{position:sticky;top:0;z-index:50;background:rgba(8,9,13,0.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border-sub)}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:860px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:590;color:var(--t1)}
.logo i{font-size:22px;font-style:normal}
.nav-links{display:flex;gap:16px}.nav-links a{font-size:13px;color:var(--t3);text-decoration:none}.nav-links a:hover{color:var(--t2)}
.hero{padding:40px 0 20px;text-align:center}
.hero h1{font-size:clamp(22px,4vw,34px);font-weight:510;color:var(--t1);letter-spacing:-1px;margin-bottom:8px}
.hero p{font-size:14px;color:var(--t3);max-width:560px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border-sub);border-radius:var(--r);padding:20px;margin-bottom:20px}
.card h2{font-size:14px;font-weight:510;color:var(--t1);margin-bottom:12px}
.card p{font-size:13px;color:var(--t3);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stat{background:rgba(255,255,255,0.02);border:1px solid var(--border-sub);border-radius:6px;padding:10px 12px}
.stat-l{font-size:10px;font-weight:590;color:var(--t4);text-transform:uppercase;letter-spacing:.5px}
.stat-v{font-size:17px;font-weight:590;color:var(--t1);font-family:JetBrains Mono,monospace;margin-top:2px}
.stat-sub{font-size:11px;color:var(--t3)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10px;font-weight:590;color:var(--t4);text-transform:uppercase;letter-spacing:.5px;padding:8px 12px;border-bottom:1px solid var(--border-sub)}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--border-sub);font-family:JetBrains Mono,monospace}
.good{color:var(--green)}.bad{color:var(--red)}.mid{color:var(--amber)}
.tag{font-size:10px;padding:2px 8px;border-radius:9999px;background:rgba(113,112,255,0.12);color:var(--a)}
.note{font-size:12px;color:var(--t4);font-style:italic;margin-top:10px}
footer{border-top:1px solid var(--border-sub);padding:32px 0 48px;font-size:13px;color:var(--t4);text-align:center}
footer a{color:var(--t3)}
</style>
</head>
<body>
<header><div class="hdr"><span class="logo"><i>🐋</i> WhaleSignal</span><div class="nav-links"><a href="index.html">Home</a><a href="stats.html">Stats</a><a href="graph.html">Graph</a></div></div></header>
<div class="con">
<section class="hero"><h1>Research & Calibration</h1><p>We publish our own report card: how the model's calls grade out, split by every feature it uses. If the numbers are bad, they're bad in public.</p></section>
<div id="content"><div class="card"><p>Loading research reports…</p></div></div>
<footer>Generated by the laptop research loop · <a href="https://github.com/Saman-ghorayshi/whalesignal">GitHub</a> · <a href="SIGNAL_MODEL.md">Model card</a></footer>
</div>
<script>
function rate(p){if(p==null)return['—','mid'];const c=p>=60?'good':p>=45?'mid':'bad';return[c+'%"'.replace('%','')+'',c]}
function pct(v){return v==null?'—':v+'%'}
async function load(){
  const el=document.getElementById('content');
  let feature=null,retro=null;
  try{feature=await fetch('data/research/feature_report.json').then(r=>r.json()).catch(()=>null)}catch(e){}
  try{retro=await fetch('data/research/retro_report.json').then(r=>r.json()).catch(()=>null)}catch(e){}
  if(!feature&&!retro){el.innerHTML='<div class="card"><p>No research reports published yet. The laptop research loop writes them once the grading ledger matures (30+ graded directional calls).</p></div>';return}
  let html='';
  if(retro){
    html+='<div class="card"><h2>Retro-Analysis — the current model replayed over history</h2>';
    html+='<p>'+esc(retro.mode||'')+'</p>';
    html+='<div class="grid"><div class="stat"><div class="stat-l">Flows simulated</div><div class="stat-v">'+(retro.flows_simulated||0).toLocaleString()+'</div></div>';
    html+='<div class="stat"><div class="stat-l">Directional</div><div class="stat-v">'+(retro.directional||0)+'</div></div>';
    html+='<div class="stat"><div class="stat-l">Accuracy</div><div class="stat-v '+(retro.accuracy>=53?'good':retro.accuracy>=45?'mid':'bad')+'">'+pct(retro.accuracy)+'</div><div class="stat-sub">baseline ≈ 53%</div></div>';
    html+='<div class="stat"><div class="stat-l">High conf (≥0.65)</div><div class="stat-v">'+pct(retro.high_confidence&&retro.high_confidence.rate)+'</div></div></div>';
    if(retro.by_regime){html+='<p style="margin-top:12px">Accuracy by tape regime at call time:</p><table class="tbl"><tr><th>Regime</th><th>Calls</th><th>Rate</th></tr>';
      for(const[k,v]of Object.entries(retro.by_regime))html+='<tr><td>'+esc(k)+'</td><td>'+v.directional+'</td><td>'+pct(v.rate)+'</td></tr>';
      html+='</table>'}
    html+='</div>';
  }
  if(feature){
    html+='<div class="card"><h2>Feature Research — does each confluence feature predict?</h2>';
    const s=feature.summary||{};
    html+='<div class="grid"><div class="stat"><div class="stat-l">Graded</div><div class="stat-v">'+(s.overall?s.overall.graded:0)+'</div></div>';
    if(s.vol_spike_rate!=null)html+='<div class="stat"><div class="stat-l">Vol-spike rate</div><div class="stat-v">'+s.vol_spike_rate+'%</div><div class="stat-sub">≥2% dailyized after flows</div></div>';
    html+='</div>';
    if(s.by_regime){html+='<p style="margin-top:12px">By regime:</p><table class="tbl"><tr><th>Regime</th><th>Directional</th><th>Rate</th></tr>';
      for(const[k,v]of Object.entries(s.by_regime))html+='<tr><td>'+esc(k)+'</td><td>'+v.directional+'</td><td>'+pct(v.rate)+'</td></tr>';
      html+='</table>'}
    if(feature.logistic)html+='<p style="margin-top:12px">Logistic fit: '+(feature.logistic.enough_data?('n='+feature.logistic.n+', train accuracy '+feature.logistic.train_accuracy+'%, weights '+JSON.stringify(feature.logistic.weights)):'insufficient data — '+feature.logistic.n+' usable rows (need 20+)')+'</p>';
    html+='</div>';
  }
  html+='<div class="card"><h2>Why this page exists</h2><p>Most signal projects show you their wins. We publish the calibration of every feature in our model — hit-rates by regime, confidence bucket, and symbol — because a whale-alert product that won\\'t grade itself isn\\'t signal, it\\'s entertainment.</p><p>Methodology: <a href="SIGNAL_MODEL.md" style="color:var(--a)">model card</a> · grading runs hourly against real prices, threshold adapts to each asset\\'s own volatility.</p></div>';
  el.innerHTML=html;
}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',load);else load();
</script>
</body></html>
