# wrangler.sentiment.toml
# Worker #6: sentiment aggregation. Every 15 min: Fear & Greed + funding rates
# + news sentiment → composite score → D1 + KV (sentiment_cache).
# Deploy with:  npx wrangler deploy -c wrangler.sentiment.toml

name = "whalesignal-sentiment"
main = "src/sentiment.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "whalesignal-db"
database_id = "6e369b7a-a8df-4864-b8f5-7bdc171ecf3d"

[[kv_namespaces]]
binding = "KV"
id = "1b3b2a8763b0497880983d3e9d26f76a"

# Secret: ADMIN_TOKEN (same value as the other workers, for /trigger)
